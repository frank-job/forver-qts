<!doctype html>
<html lang="en" class="h-full scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Forever Quotes | A Cinematic Treasury of Wisdom</title>
  <meta name="description" content="An elegant, interactive quotes generator and builder styled with glassmorphism and Tailwind CSS. Save your favorites, listen to quotes, and design your own.">
  
  <!-- Preconnecting Google Fonts for speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="h-full bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white antialiased overflow-x-hidden">
  
  <!-- Animated Background Blobs -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-50">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] animate-pulse duration-10000"></div>
    <div class="absolute top-1/2 left-1/3 w-80 h-80 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] animate-pulse duration-7000"></div>
    <div class="absolute -bottom-20 -right-20 w-[500px] h-[500px] bg-indigo-600 rounded-full mix-blend-screen filter blur-[150px] animate-pulse duration-8000"></div>
  </div>

  <!-- App Wrapper -->
  <div id="app" class="min-h-full flex flex-col justify-between">
    <!-- App will inject content here -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="flex flex-col items-center space-y-4">
        <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-indigo-400 font-medium tracking-wide">Gathering timeless wisdom...</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
